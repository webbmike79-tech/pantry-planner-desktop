<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="seaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3954"/>
      <stop offset="50%" stop-color="#087e8b"/>
      <stop offset="100%" stop-color="#3caea3"/>
    </linearGradient>
    <linearGradient id="salmonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b54"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#seaBg)"/>
  <!-- Plate shadow -->
  <ellipse cx="200" cy="165" rx="135" ry="24" fill="#000000" opacity="0.35"/>
  <!-- Oval Dinner Plate -->
  <ellipse cx="200" cy="150" rx="130" ry="26" fill="#f8f9fa"/>
  <ellipse cx="200" cy="146" rx="120" ry="21" fill="#e9ecef"/>
  <!-- Asparagus Spears -->
  <line x1="140" y1="148" x2="210" y2="136" stroke="#2b8a3e" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="145" y1="154" x2="215" y2="142" stroke="#2b8a3e" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="150" y1="160" x2="220" y2="148" stroke="#2f9e44" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Grilled Salmon Fillet -->
  <g transform="translate(205, 134) rotate(-8)">
    <path d="M-45,15 C-45,-15 35,-18 45,5 C48,18 20,22 -45,15 Z" fill="url(#salmonSkin)"/>
    <!-- Grill Marks -->
    <line x1="-30" y1="-8" x2="-22" y2="16" stroke="#491206" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="-4" y2="15" stroke="#491206" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-12" x2="16" y2="14" stroke="#491206" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="-6" x2="34" y2="10" stroke="#491206" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fresh Dill Sprig -->
    <line x1="-10" y1="0" x2="20" y2="2" stroke="#51cf66" stroke-width="1.5"/>
    <line x1="-2" y1="0" x2="2" y2="-4" stroke="#51cf66" stroke-width="1.5"/>
    <line x1="6" y1="1" x2="10" y2="-3" stroke="#51cf66" stroke-width="1.5"/>
    <line x1="14" y1="2" x2="18" y2="-2" stroke="#51cf66" stroke-width="1.5"/>
  </g>
  <!-- Lemon Wedge -->
  <path d="M145,142 A18,18 0 0,1 170,126 L145,142 Z" fill="#ffd43b" stroke="#fab005" stroke-width="1.5"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🐟 SEAFOOD &amp; FISH</text>
</svg>
