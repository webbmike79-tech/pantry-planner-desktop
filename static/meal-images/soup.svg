<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="soupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1505"/>
      <stop offset="50%" stop-color="#943310"/>
      <stop offset="100%" stop-color="#d95e16"/>
    </linearGradient>
    <linearGradient id="brothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f08c00"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#soupBg)"/>
  <!-- Bowl shadow -->
  <ellipse cx="200" cy="165" rx="125" ry="24" fill="#000000" opacity="0.35"/>
  <!-- Soup Bowl Outer -->
  <ellipse cx="200" cy="142" rx="115" ry="34" fill="#ffffff"/>
  <ellipse cx="200" cy="138" rx="108" ry="30" fill="#f8f9fa"/>
  <!-- Steaming Broth -->
  <ellipse cx="200" cy="136" rx="98" ry="24" fill="url(#brothGrad)"/>
  <!-- Cream Swirl -->
  <path d="M165,134 C175,125 210,125 220,135 C225,142 205,145 195,142 C185,140 180,134 190,132" fill="none" stroke="#fff9db" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Fresh Herb Garnish / Parsley -->
  <circle cx="195" cy="132" r="3.5" fill="#2b8a3e"/>
  <circle cx="198" cy="128" r="3" fill="#37b24d"/>
  <circle cx="192" cy="130" r="3" fill="#2f9e44"/>
  <!-- Cracked Pepper -->
  <circle cx="178" cy="138" r="1.5" fill="#212529"/>
  <circle cx="214" cy="130" r="1.5" fill="#212529"/>
  <circle cx="205" cy="144" r="1.5" fill="#212529"/>
  <!-- Crusty Baguette / Spoon -->
  <g transform="translate(265, 125) rotate(-25)">
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="#d08b58" stroke="#a05d2c" stroke-width="2"/>
    <line x1="-15" y1="-5" x2="-8" y2="5" stroke="#a05d2c" stroke-width="2"/>
    <line x1="-3" y1="-7" x2="4" y2="3" stroke="#a05d2c" stroke-width="2"/>
    <line x1="10" y1="-5" x2="16" y2="4" stroke="#a05d2c" stroke-width="2"/>
  </g>
  <!-- Cozy Steam -->
  <path d="M185,108 Q180,90 190,75 T185,55" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M210,110 Q220,92 212,78 T218,58" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🍲 SOUPS, STEWS &amp; CHILI</text>
</svg>
