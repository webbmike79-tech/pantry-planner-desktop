<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="saladBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3e"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#saladBg)"/>
  <!-- Bowl shadow -->
  <ellipse cx="200" cy="165" rx="120" ry="22" fill="#000000" opacity="0.3"/>
  <!-- Ceramic Salad Bowl -->
  <ellipse cx="200" cy="144" rx="115" ry="32" fill="#f8f9fa"/>
  <ellipse cx="200" cy="140" rx="108" ry="26" fill="#e9ecef"/>
  <!-- Mixed Crisp Greens & Spinach -->
  <g fill="#40916c">
    <ellipse cx="170" cy="130" rx="22" ry="12" transform="rotate(-15, 170, 130)"/>
    <ellipse cx="225" cy="132" rx="24" ry="14" transform="rotate(20, 225, 132)"/>
    <ellipse cx="195" cy="125" rx="26" ry="14"/>
  </g>
  <g fill="#74c69d">
    <ellipse cx="160" cy="138" rx="20" ry="10" transform="rotate(10, 160, 138)"/>
    <ellipse cx="240" cy="138" rx="22" ry="11" transform="rotate(-10, 240, 138)"/>
    <ellipse cx="200" cy="138" rx="25" ry="12"/>
  </g>
  <!-- Cherry Tomatoes -->
  <circle cx="165" cy="132" r="7.5" fill="#e63946"/>
  <circle cx="215" cy="128" r="8" fill="#e63946"/>
  <circle cx="185" cy="142" r="7" fill="#e63946"/>
  <!-- Cucumber Slices -->
  <circle cx="195" cy="126" r="8" fill="#d8f3dc" stroke="#52b788" stroke-width="2"/>
  <circle cx="230" cy="136" r="7.5" fill="#d8f3dc" stroke="#52b788" stroke-width="2"/>
  <!-- Red Onion Slivers -->
  <path d="M172,122 Q180,118 190,123" fill="none" stroke="#7209b7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M205,135 Q215,130 225,136" fill="none" stroke="#7209b7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Croutons -->
  <rect x="150" y="142" width="9" height="9" rx="1.5" fill="#e0a96d"/>
  <rect x="220" y="144" width="8" height="8" rx="1.5" fill="#c48b4d"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🥗 FRESH SALADS &amp; BOWLS</text>
</svg>
