<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="homeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1e3d"/>
      <stop offset="50%" stop-color="#5c3d75"/>
      <stop offset="100%" stop-color="#9a5b8a"/>
    </linearGradient>
    <linearGradient id="skilletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#495057"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
    <linearGradient id="stewGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c92a2a"/>
      <stop offset="50%" stop-color="#e8590c"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#homeBg)"/>
  <!-- Skillet shadow -->
  <ellipse cx="190" cy="165" rx="100" ry="20" fill="#000000" opacity="0.35"/>
  <!-- Cast Iron Skillet Handle -->
  <path d="M275,138 L325,125 C330,123 335,127 332,132 L285,148 Z" fill="url(#skilletGrad)"/>
  <ellipse cx="325" cy="129" rx="3.5" ry="5" fill="#15171a"/>
  <!-- Skillet Body -->
  <ellipse cx="190" cy="142" rx="95" ry="28" fill="url(#skilletGrad)"/>
  <ellipse cx="190" cy="139" rx="88" ry="24" fill="#343a40"/>
  <!-- Simmering Home Cooked Stew -->
  <ellipse cx="190" cy="138" rx="80" ry="20" fill="url(#stewGrad)"/>
  <!-- Fresh Herb Sprigs -->
  <path d="M165,138 Q180,128 195,135" fill="none" stroke="#51cf66" stroke-width="3" stroke-linecap="round"/>
  <circle cx="175" cy="132" r="3.5" fill="#40c057"/>
  <circle cx="188" cy="130" r="3.5" fill="#40c057"/>
  <!-- Veggie & Protein Chunks -->
  <circle cx="160" cy="138" r="6" fill="#e03131"/>
  <circle cx="210" cy="136" r="6.5" fill="#ffd43b"/>
  <circle cx="185" cy="144" r="5.5" fill="#74c0fc"/>
  <rect x="195" y="132" width="12" height="9" rx="2.5" fill="#8d5b4c"/>
  <!-- Aromatic Steam -->
  <path d="M175,115 Q170,95 180,80 T175,60" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M205,118 Q215,98 208,82 T215,62" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🍳 HOMESTYLE COOKING</text>
</svg>
