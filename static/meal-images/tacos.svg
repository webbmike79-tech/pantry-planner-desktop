<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tacoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b43a18"/>
      <stop offset="50%" stop-color="#e65c00"/>
      <stop offset="100%" stop-color="#f9d423"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd043"/>
      <stop offset="100%" stop-color="#e09819"/>
    </linearGradient>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c2605"/>
      <stop offset="100%" stop-color="#7a3407"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#tacoBg)"/>
  <!-- Plate shadow -->
  <ellipse cx="200" cy="165" rx="140" ry="24" fill="#000000" opacity="0.25"/>
  <!-- Plate -->
  <ellipse cx="200" cy="158" rx="135" ry="22" fill="#ffffff" opacity="0.9"/>
  <!-- Left Taco -->
  <g transform="translate(140, 105) rotate(-12)">
    <path d="M-60,35 C-50,-25 50,-25 60,35 Z" fill="url(#shellGrad)" stroke="#c47a0b" stroke-width="2"/>
    <path d="M-45,25 C-30,5 30,5 45,25 Z" fill="url(#meatGrad)"/>
    <!-- Lettuce -->
    <path d="M-40,18 Q-25,2 -10,18 Q5,2 20,18 Q35,2 45,20" fill="none" stroke="#48b83e" stroke-width="6" stroke-linecap="round"/>
    <!-- Tomatoes -->
    <circle cx="-20" cy="12" r="5" fill="#e72d2d"/>
    <circle cx="5" cy="10" r="5.5" fill="#e72d2d"/>
    <circle cx="28" cy="14" r="4.5" fill="#e72d2d"/>
    <!-- Cheese shreds -->
    <path d="M-30,14 L-22,17 M-8,8 L-2,14 M14,10 L22,16" stroke="#fff455" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Right Taco -->
  <g transform="translate(250, 115) rotate(10)">
    <path d="M-55,30 C-45,-25 45,-25 55,30 Z" fill="url(#shellGrad)" stroke="#c47a0b" stroke-width="2"/>
    <path d="M-40,20 C-25,3 25,3 40,20 Z" fill="url(#meatGrad)"/>
    <path d="M-35,14 Q-20,0 -5,14 Q10,0 25,14" fill="none" stroke="#48b83e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-15" cy="8" r="5" fill="#e72d2d"/>
    <circle cx="12" cy="7" r="5" fill="#e72d2d"/>
    <path d="M-22,10 L-14,14 M0,6 L6,12" stroke="#fff455" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Lime wedge -->
  <path d="M100,150 A20,20 0 0,1 125,130 L100,150 Z" fill="#7ed957"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🌮 TEX-MEX &amp; TACOS</text>
</svg>
