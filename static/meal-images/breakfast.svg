<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="morningBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9480f"/>
      <stop offset="50%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="pancakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd8a8"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#morningBg)"/>
  <!-- Plate shadow -->
  <ellipse cx="200" cy="165" rx="135" ry="24" fill="#000000" opacity="0.3"/>
  <!-- Breakfast Plate -->
  <ellipse cx="200" cy="152" rx="130" ry="25" fill="#ffffff"/>
  <ellipse cx="200" cy="148" rx="120" ry="21" fill="#f8f9fa"/>
  <!-- Golden Pancakes Stack (Left) -->
  <ellipse cx="155" cy="142" rx="42" ry="12" fill="url(#pancakeGrad)" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="155" cy="134" rx="40" ry="11" fill="url(#pancakeGrad)" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="155" cy="126" rx="38" ry="10" fill="url(#pancakeGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Melting Butter Cube -->
  <rect x="148" y="118" width="14" height="10" rx="2" fill="#fff3bf" stroke="#fcc419" stroke-width="1.5"/>
  <!-- Sunny Side Up Egg (Right) -->
  <ellipse cx="245" cy="138" rx="38" ry="15" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5"/>
  <circle cx="245" cy="136" r="13" fill="#ff922b"/>
  <circle cx="242" cy="133" r="10" fill="#fcc419"/>
  <circle cx="240" cy="131" r="3.5" fill="#ffffff" opacity="0.8"/>
  <!-- Crispy Bacon Strips -->
  <path d="M190,146 Q200,140 210,146 T230,146" fill="none" stroke="#a61e4d" stroke-width="5" stroke-linecap="round"/>
  <path d="M190,146 Q200,140 210,146 T230,146" fill="none" stroke="#ff8787" stroke-width="2" stroke-linecap="round"/>
  <text x="20" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" opacity="0.9" letter-spacing="1">🍳 BREAKFAST &amp; BRUNCH</text>
</svg>
